services:
  db:
    image: postgres:16
    container_name: physiqai_db
    environment:
      POSTGRES_DB: physiqai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d physiqai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
